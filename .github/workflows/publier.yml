# Publie le site sur GitHub Pages à chaque modification, et met à jour les résultats aux heures ci-dessous.
# Les heures sont en UTC : ajoutez 1 h en hiver et 2 h en été pour l'heure française.
# En cas d'échec, le site reste tel quel et GitHub prévient le propriétaire du dépôt par e-mail.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 5 * * *"          # chaque matin, lundi compris
    - cron: "7 17,21 * * 0,6"    # samedi et dimanche soir, après les matchs
  workflow_dispatch:

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Mettre à jour les résultats
        if: github.event_name != 'push'
        env:
          TZ: Europe/Paris
        run: |
          perl scripts/maj-resultats.pl
          git config user.name "Mise à jour ASSG"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/resultats.js assets/clubs
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des résultats"
            git pull --rebase origin main
            git push
          fi

      - name: Préparer les fichiers du site
        run: |
          mkdir _site
          cp -R index.html mentions-legales.html css js assets _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v5
